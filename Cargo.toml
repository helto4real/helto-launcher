[package]
name = "helto-launcher"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A minimal GTK4 application launcher for Arch Linux and Hyprland"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
gtk4 = "0.10"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
